<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="Stylized vehicle yard plan">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#b4ad9d" stroke-width="1" opacity=".35"/>
    </pattern>
    <pattern id="lane" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0v80" stroke="#ece7d9" stroke-width="2" stroke-dasharray="18 16" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1800" height="1200" fill="#d8d4c7"/>
  <rect width="1800" height="1200" fill="url(#grid)"/>
  <rect x="0" y="430" width="1800" height="220" fill="#c9c5b8"/>
  <rect x="0" y="430" width="1800" height="220" fill="url(#lane)"/>
  <rect x="0" y="880" width="1800" height="180" fill="#c9c5b8"/>
  <rect x="0" y="880" width="1800" height="180" fill="url(#lane)"/>

  <!-- warehouses / offices -->
  <g stroke="#7f8c7f" stroke-width="2">
    <rect x="90" y="90" width="560" height="250" fill="#e8e1d2"/>
    <rect x="120" y="125" width="500" height="170" fill="#d8d0be"/>
    <rect x="1280" y="810" width="430" height="230" fill="#e8e1d2"/>
    <rect x="1310" y="840" width="370" height="160" fill="#d8d0be"/>
  </g>
  <g fill="#8b978a" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="2">
    <text x="120" y="372">WAREHOUSE / W-04</text>
    <text x="1310" y="1082">GATE / G-09</text>
    <text x="58" y="700">LANE / NORTH</text>
  </g>

  <!-- container stacks -->
  <g stroke="#7a7d70" stroke-width="1.4">
    <g fill="#b3a58c">
      <rect x="90" y="480" width="70" height="140"/><rect x="170" y="480" width="70" height="140"/>
      <rect x="250" y="480" width="70" height="140"/><rect x="330" y="480" width="70" height="140"/>
      <rect x="90" y="640" width="70" height="140"/><rect x="170" y="640" width="70" height="140"/>
      <rect x="250" y="640" width="70" height="140"/><rect x="330" y="640" width="70" height="140"/>
    </g>
    <g fill="#9aa89a">
      <rect x="520" y="980" width="130" height="55"/><rect x="660" y="980" width="130" height="55"/>
      <rect x="800" y="980" width="130" height="55"/><rect x="940" y="980" width="130" height="55"/>
    </g>
    <g fill="#c1a07c">
      <rect x="1430" y="930" width="90" height="38"/><rect x="1530" y="930" width="90" height="38"/>
      <rect x="1430" y="978" width="90" height="38"/><rect x="1530" y="978" width="90" height="38"/>
    </g>
  </g>

  <!-- vehicles -->
  <g stroke="#4f5d55" stroke-width="2.5" stroke-linejoin="round">
    <g transform="translate(760 300) rotate(-4)">
      <rect x="0" y="0" width="145" height="42" rx="7" fill="#a9b8ac"/>
      <rect x="26" y="4" width="34" height="34" fill="#d9e2dc"/>
      <rect x="76" y="4" width="52" height="34" fill="#8e9e93"/>
      <circle cx="30" cy="43" r="6" fill="#303b35"/><circle cx="112" cy="43" r="6" fill="#303b35"/>
    </g>
    <g transform="translate(1020 330) rotate(2)">
      <rect x="0" y="0" width="102" height="34" rx="7" fill="#b9a88f"/>
      <rect x="18" y="3" width="27" height="28" fill="#eef0e7"/>
      <rect x="58" y="3" width="30" height="28" fill="#9e8c73"/>
      <circle cx="23" cy="36" r="5" fill="#303b35"/><circle cx="82" cy="36" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(575 665) rotate(86)">
      <rect x="0" y="0" width="128" height="38" rx="7" fill="#9eafa4"/>
      <rect x="22" y="4" width="30" height="30" fill="#dbe4de"/>
      <rect x="70" y="4" width="44" height="30" fill="#87988d"/>
      <circle cx="27" cy="40" r="5" fill="#303b35"/><circle cx="106" cy="40" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(1210 620) rotate(24)">
      <rect x="0" y="0" width="160" height="44" rx="7" fill="#b7a88d"/>
      <rect x="28" y="4" width="36" height="36" fill="#eef0e7"/>
      <rect x="84" y="4" width="58" height="36" fill="#8d7c62"/>
      <circle cx="32" cy="46" r="6" fill="#303b35"/><circle cx="132" cy="46" r="6" fill="#303b35"/>
    </g>
    <g transform="translate(1440 720) rotate(-12)">
      <rect x="0" y="0" width="108" height="36" rx="7" fill="#a3b1a6"/>
      <rect x="18" y="3" width="28" height="30" fill="#e8ece6"/>
      <rect x="60" y="3" width="34" height="30" fill="#87988d"/>
      <circle cx="23" cy="38" r="5" fill="#303b35"/><circle cx="88" cy="38" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(745 940) rotate(3)">
      <rect x="0" y="0" width="116" height="40" rx="7" fill="#b9a88f"/>
      <rect x="22" y="4" width="32" height="32" fill="#eef0e7"/>
      <rect x="68" y="4" width="36" height="32" fill="#917f67"/>
      <circle cx="28" cy="42" r="5" fill="#303b35"/><circle cx="94" cy="42" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(1030 800) rotate(-18)">
      <rect x="0" y="0" width="100" height="34" rx="7" fill="#9eafa4"/>
      <rect x="18" y="3" width="28" height="28" fill="#e8ece6"/>
      <rect x="58" y="3" width="30" height="28" fill="#87988d"/>
      <circle cx="23" cy="36" r="5" fill="#303b35"/><circle cx="84" cy="36" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(1510 360) rotate(8)">
      <rect x="0" y="0" width="114" height="38" rx="7" fill="#b3a58c"/>
      <rect x="20" y="4" width="30" height="30" fill="#eef0e7"/>
      <rect x="66" y="4" width="36" height="30" fill="#8e7c64"/>
      <circle cx="27" cy="40" r="5" fill="#303b35"/><circle cx="94" cy="40" r="5" fill="#303b35"/>
    </g>
    <g transform="translate(420 900) rotate(-8)">
      <rect x="0" y="0" width="96" height="32" rx="7" fill="#a3b1a6"/>
      <rect x="16" y="3" width="28" height="26" fill="#e8ece6"/>
      <rect x="54" y="3" width="30" height="26" fill="#87988d"/>
      <circle cx="22" cy="34" r="5" fill="#303b35"/><circle cx="80" cy="34" r="5" fill="#303b35"/>
    </g>
  </g>

  <!-- lane arrows -->
  <g fill="#c75b36">
    <path d="M650 500h120l-18-13v26z"/><path d="M1600 500h-120l18-13v26z"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="16" fill="#7d897f" letter-spacing="2">
    <text x="90" y="1140">YARD / V-17</text>
    <text x="1510" y="1140">BAY 03</text>
  </g>
</svg>
